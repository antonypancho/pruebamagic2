<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>BingoMagic 8:00pm — Juega tu Cartón</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --fondo:#3A29BA;
    --texto:#ffffff;
    --carton:#1b1b1b;
    --marcado:#2196f3;
    --borde:#ffffff;
    --free-bg:#444444;

    --escalaCarton:1;
    --tamanoCelda:50px;
    --tamanoFuente:28px;
    --tamanoFuenteHeader:24px;

    --alto-header:64px;
    --alto-toolbar:56px;
    --altoTop: calc(var(--alto-header) + var(--alto-toolbar));

    --gap:12px;
    --titulo-carton:#00d4ff;
  }

  /* reset mínimo */
  *,*::before,*::after{box-sizing:border-box;}
  html,body{height:100%; margin:0; padding:0;}
  body{
    font-family: 'Segoe UI', Arial, sans-serif;
    background:var(--fondo);
    color:var(--texto);
    text-align:center;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    padding-top: var(--altoTop);
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }

  /* HEADER fijo en top 0 */
  header{
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: var(--alto-header);
    display:flex;
    align-items:center;
    gap:12px;
    padding:8px 16px;
    background:#191d34;
    z-index: 10000;
    box-shadow: 0 2px 6px rgba(0,0,0,0.4);
  }
  header img{ height:48px; width:auto; display:block; }
  header h1{ margin:0; font-size:1.15rem; color:#ffeb3b; }

  /* TOOLBAR fijo justo debajo del header */
  .toolbar{
    position: fixed;
    top: var(--alto-header);
    left: 0;
    right: 0;
    height: var(--alto-toolbar);
    display:flex;
    align-items:center;
    justify-content:center;
    gap:var(--gap);
    padding:6px 12px;
    background:#121528;
    z-index: 10000;
    box-shadow: 0 2px 6px rgba(0,0,0,0.25);
    border-bottom:1px solid rgba(255,255,255,0.06);
  }
  .toolbar input, .toolbar button {
    padding:8px 12px;
    font-size:14px;
    border-radius:8px;
    border:none;
  }
  .toolbar button { background:linear-gradient(135deg,#00d4ff,#6c5ce7); color:#fff; cursor:pointer; }
  .toolbar .temas{ display:flex; gap:8px; margin-left:6px; }

  main{ max-width:1200px; margin:0 auto; padding:16px; }

  /* guía y cartones */
  #guiaFigura{ margin:8px auto 18px; background:#f5f5f5; padding:10px; border-radius:10px; color:#000; display:inline-block; }
  #tablaGuia{ border-collapse:collapse; }
  #tablaGuia td{ width:40px; height:40px; border:1px solid #bbb; text-align:center; font-weight:bold; cursor:pointer; background:#fff; }
  #tablaGuia td.relleno{ background:#ff9800; color:#fff; }
  #tablaGuia td.centro{ background:#eaeaea; color:#000; font-weight:bold; cursor:default; }

  #cartonesContainer{ display:flex; flex-wrap:wrap; justify-content:center; gap:12px; padding:8px 6px 40px; }
  .carton{ position:relative; display:inline-block; margin:8px; padding:10px; background:var(--carton); border-radius:8px; min-width: calc(5 * var(--tamanoCelda) * 0.8); box-shadow:0 6px 18px rgba(0,0,0,.25); }
  .carton h3{ margin:0 0 8px; color:var(--titulo-carton); font-size:1rem; }

  .close-btn{ position:absolute; top:6px; right:6px; width:28px; height:28px; border-radius:6px; border:none; background:rgba(0,0,0,.45); color:#fff; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .close-btn:hover{ background:rgba(255,0,0,.9); transform:translateY(-1px); }

  table{ border-collapse:collapse; margin:auto; width:100%; }
  th{ width:calc(var(--tamanoCelda) * var(--escalaCarton)); height:calc(40px * var(--escalaCarton)); border:1px solid var(--borde); font-size:calc(var(--tamanoFuenteHeader) * var(--escalaCarton)); color:#ffeb3b; text-align:center; padding:4px; box-sizing:border-box; }
  td{ width:calc(var(--tamanoCelda) * var(--escalaCarton)); height:calc(var(--tamanoCelda) * var(--escalaCarton)); border:1px solid var(--borde); cursor:pointer; font-weight:bold; text-align:center; font-size:calc(var(--tamanoFuente) * var(--escalaCarton)); color:var(--texto); background:transparent; padding:4px; box-sizing:border-box; user-select:none; }
  td.free{ background:var(--free-bg); color:#000; cursor:default; }
  td.marcado1{ background:var(--marcado); color:#fff; }

  .invisibleNumero{ color:transparent; transition:color .18s ease; }

  #status{ margin-top:8px; font-size:.9em; color:#ccc; min-height:1.2em; }

  footer{ margin-top:28px; padding:16px; text-align:center; font-size:.9rem; color:#aaa; background:#191d34; }

  @media (max-width:520px){
    :root{ --tamanoCelda:40px; --tamanoFuente:18px; --tamanoFuenteHeader:16px; --alto-header:56px; --alto-toolbar:56px; --altoTop: calc(var(--alto-header) + var(--alto-toolbar)); }
    header h1{ font-size:1rem; }
  }
</style>
</head>
<body>

<header role="banner" aria-hidden="false">
  <img src="logo.png" alt="Logo Bingo 8pm">
  <h1>🎉 Bingo Magic 8:00pm</h1>
</header>

<div class="toolbar" role="region" aria-label="Barra de herramientas">
  <input id="cartonInput" type="number" placeholder="Número de cartón" aria-label="Número de cartón">
  <button id="agregarBtn" disabled>Agregar</button>
  <button id="limpiarBtn">Limpiar</button>
  <button id="quitarBtn">Quitar</button>
  <button id="zoomIn">+</button>
  <button id="zoomOut">-</button>
  <div class="temas" role="toolbar" aria-label="Temas">
    <div style="background:#000;" onclick="cambiarTema('azul')" title="Azul" role="button" tabindex="0"></div>
    <div style="background:#fff;" onclick="cambiarTema('verde')" title="Verde" role="button" tabindex="0"></div>
    <div style="background:#9c27b0;" onclick="cambiarTema('morado')" title="Morado" role="button" tabindex="0"></div>
  </div>
  <div id="status" aria-live="polite"></div>
</div>

<main>
  <h1>🎟️ Juega tu Cartón</h1>
  <h2>👇Dibuja La Figura que estamos jugando👇</h2>

  <div id="guiaFigura">
    <table id="tablaGuia" role="grid"></table>
  </div>

  <div id="cartonesContainer" role="region" aria-live="polite"></div>
</main>

<footer role="contentinfo">&copy; 2025 BingoMagic.online</footer>

<script>
/* Estado y elementos */
const cartonesContainer = document.getElementById('cartonesContainer');
const agregarBtn = document.getElementById('agregarBtn');
const limpiarBtn = document.getElementById('limpiarBtn');
const quitarBtn = document.getElementById('quitarBtn');
const zoomInBtn = document.getElementById('zoomIn');
const zoomOutBtn = document.getElementById('zoomOut');
const statusEl = document.getElementById('status');

let cartonesData = [];
let cartonesMostrados = [];

/* Inicialización */
document.addEventListener('DOMContentLoaded', () => {
  const tema = localStorage.getItem('temaBingo');
  if (tema) cambiarTema(tema);
  const zoom = localStorage.getItem('zoomCarton');
  if (zoom) document.documentElement.style.setProperty('--escalaCarton', zoom);

  crearGuia();
  restaurarGuia();

  cargarCSV().then(() => {
    agregarBtn.disabled = false;
    restaurarEstado();
    aplicarGuiaBordes();
  });

  agregarBtn.addEventListener('click', agregarCarton);
  limpiarBtn.addEventListener('click', limpiarMarcas);
  quitarBtn.addEventListener('click', quitarCartones);
  zoomInBtn.addEventListener('click', () => ajustarZoom(-0.1));
  zoomOutBtn.addEventListener('click', () => ajustarZoom(0.1));

  /* Delegación de clics y teclado para celdas dinámicas */
  cartonesContainer.addEventListener('click', (e) => {
    const td = e.target.closest('td');
    if (!td || !cartonesContainer.contains(td)) return;
    if (td.classList.contains('free')) return;
    cambiarColor(td);
  });
  cartonesContainer.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    const td = e.target.closest('td');
    if (!td || !cartonesContainer.contains(td)) return;
    if (td.classList.contains('free')) return;
    e.preventDefault();
    cambiarColor(td);
  });
});

/* CSV loader */
async function cargarCSV(){
  statusEl.textContent = 'Cargando cartones...';
  try {
    const res = await fetch('./csv/cartones.csv', { cache: 'no-store' });
    if (!res.ok) throw new Error('CSV no encontrado');
    const text = await res.text();
    cartonesData = parseCSV(text);
    statusEl.textContent = `✅ ${cartonesData.length} cartones cargados.`;
  } catch (err) {
    console.error(err);
    statusEl.textContent = 'Error cargando CSV.';
    agregarBtn.disabled = true;
  }
}
function parseCSV(text){
  const lines = text.split(/\r?\n/).map(l=>l.trim()).filter(l=>l!=='');
  const cartones = [];
  let i=0;
  while(i<lines.length){
    if (lines[i].toUpperCase().startsWith('CARTÓN')) { i++; continue; }
    if (lines[i].toUpperCase() === 'B,I,N,G,O') { i++; }
    const carton=[];
    for (let r=0;r<5 && i<lines.length; r++, i++){
      carton.push(lines[i].split(',').map(n=>n.trim()));
    }
    if (carton.length===5) cartones.push(carton);
  }
  return cartones;
}

/* Render / UI */
function agregarCarton(){
  const n = parseInt(document.getElementById('cartonInput').value,10);
  if (isNaN(n)) { alert('Ingresa un número.'); return; }
  if (n<1 || n>cartonesData.length) { alert('Número inválido.'); return; }
  if (cartonesMostrados.includes(n)) { alert('Ese cartón ya está en pantalla.'); return; }
  renderCarton(n);
  guardarEstado();
  document.getElementById('cartonInput').value = '';
}
function renderCarton(numero){
  const carton = cartonesData[numero-1];
  if (!carton) return;
  const el = document.createElement('div');
  el.className = 'carton';
  el.dataset.numero = numero;
  el.innerHTML = `<h3>Cartón ${numero}</h3><div class="tabla-wrapper"><table>${crearTabla(carton, numero)}</table></div>`;
  const btn = document.createElement('button');
  btn.className = 'close-btn';
  btn.type='button';
  btn.innerText='✕';
  btn.addEventListener('click', () => {
    if (!confirm(`¿Quitar el cartón ${numero}?`)) return;
    el.remove();
    const idx = cartonesMostrados.indexOf(numero);
    if (idx>-1) cartonesMostrados.splice(idx,1);
    actualizarEstadoDespuesEliminar();
    aplicarGuiaBordes();
  });
  el.appendChild(btn);
  cartonesContainer.appendChild(el);
  cartonesMostrados.push(numero);
  aplicarGuiaBordes();
  attachCellListeners(el);
}
function crearTabla(carton, numero){
  const letras=['B','I','N','G','O'];
  let html='<tr>';
  for(let c=0;c<5;c++) html+=`<th>${letras[c]}</th>`;
  html+='</tr>';
  for(let r=0;r<5;r++){
    html+='<tr>';
    for(let c=0;c<5;c++){
      const val = carton[r][c] ?? '';
      const isFree = (typeof val==='string' && val.toUpperCase()==='X');
      const cls = isFree ? 'free' : '';
      html+=`<td class="${cls}" data-carton="${numero}" data-pos="${r},${c}" tabindex="${isFree?-1:0}" role="gridcell">${val}</td>`;
    }
    html+='</tr>';
  }
  return html;
}

/* Accessibility: attach keyboard handler for new cells */
function attachCellListeners(root){
  root.querySelectorAll('td').forEach(td=>{
    if (!td.classList.contains('free')) {
      td.setAttribute('tabindex', td.getAttribute('tabindex') ?? 0);
      td.addEventListener('keydown', (e)=>{
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); cambiarColor(td); }
      });
    }
  });
}

/* marcar */
function cambiarColor(td){
  if (td.classList.contains('free')) return;
  td.classList.toggle('marcado1');
  guardarEstado();
}

/* limpiar / quitar */
function limpiarMarcas(){
  document.querySelectorAll('#cartonesContainer td.marcado1').forEach(t => t.classList.remove('marcado1'));
  guardarEstado();
  document.querySelectorAll('#cartonesContainer td.bordeGuia').forEach(t => t.classList.remove('bordeGuia'));
  localStorage.removeItem('guiaFigura');
  crearGuia();
}
function quitarCartones(){
  cartonesContainer.innerHTML='';
  cartonesMostrados=[];
  localStorage.removeItem('estadoCartones');
  statusEl.textContent='Se quitaron los cartones.';
  localStorage.removeItem('guiaFigura');
  crearGuia();
}
function actualizarEstadoDespuesEliminar(){
  const estadoStr = localStorage.getItem('estadoCartones');
  if (!estadoStr) { guardarEstado(); return; }
  try{
    const estado = JSON.parse(estadoStr);
    if (Array.isArray(estado.marcados)) {
      estado.marcados = estado.marcados.filter(m => cartonesMostrados.includes(parseInt(m.carton,10)));
    }
    estado.cartones = cartonesMostrados.slice();
    localStorage.setItem('estadoCartones', JSON.stringify(estado));
  }catch(e){ guardarEstado(); }
}

/* persistencia */
function guardarEstado(){
  const estado = { cartones: cartonesMostrados.slice(), marcados: [] };
  document.querySelectorAll('#cartonesContainer td.marcado1').forEach(td=>{
    estado.marcados.push({ carton: td.dataset.carton, pos: td.dataset.pos });
  });
  localStorage.setItem('estadoCartones', JSON.stringify(estado));
}
function restaurarEstado(){
  const s = localStorage.getItem('estadoCartones'); if (!s) return;
  let estado; try{ estado = JSON.parse(s);}catch{return;}
  if (Array.isArray(estado.cartones)) estado.cartones.forEach(n => renderCarton(n));
  if (Array.isArray(estado.marcados)) {
    setTimeout(()=> {
      estado.marcados.forEach(m=>{
        const td = document.querySelector(`#cartonesContainer td[data-carton="${m.carton}"][data-pos="${m.pos}"]`);
        if (td) td.classList.add('marcado1');
      });
    },120);
  }
}

/* zoom */
function ajustarZoom(delta){
  let e = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--escalaCarton')) || 1;
  e = Math.round((e + delta)*100)/100;
  if (e < 0.4) e = 0.4;
  if (e > 2) e = 2;
  document.documentElement.style.setProperty('--escalaCarton', e);
  localStorage.setItem('zoomCarton', e);
}

/* temas */
function cambiarTema(color){
  if (color==='azul'){ document.documentElement.style.setProperty('--carton','#1b1b1b'); document.documentElement.style.setProperty('--texto','#ffffff'); document.documentElement.style.setProperty('--marcado','#2196f3'); document.documentElement.style.setProperty('--borde','#ada8a8'); document.documentElement.style.setProperty('--free-bg','#444444'); document.documentElement.style.setProperty('--titulo-carton','#00d4ff'); }
  if (color==='verde'){ document.documentElement.style.setProperty('--carton','#f5f5f5'); document.documentElement.style.setProperty('--texto','#000000'); document.documentElement.style.setProperty('--marcado','#4caf50'); document.documentElement.style.setProperty('--borde','#333333'); document.documentElement.style.setProperty('--free-bg','#e0e0e0'); document.documentElement.style.setProperty('--titulo-carton','#2e7d32'); }
  if (color==='morado'){ document.documentElement.style.setProperty('--carton','#f8bbd0'); document.documentElement.style.setProperty('--texto','#000000'); document.documentElement.style.setProperty('--marcado','#e91e63'); document.documentElement.style.setProperty('--borde','#ffffff'); document.documentElement.style.setProperty('--titulo-carton','#6a1b9a'); }
  localStorage.setItem('temaBingo', color);
}

/* guía 5x5 */
function crearGuia(){
  const t = document.getElementById('tablaGuia'); t.innerHTML='';
  for(let r=0;r<5;r++){
    const tr = document.createElement('tr');
    for(let c=0;c<5;c++){
      const td = document.createElement('td');
      td.dataset.pos = `${r},${c}`;
      if (r===2 && c===2){ td.textContent='X'; td.classList.add('centro'); td.setAttribute('aria-hidden','true'); }
      else {
        td.tabIndex = 0;
        td.addEventListener('click', ()=> { td.classList.toggle('relleno'); guardarGuia(); aplicarGuiaBordes(); });
        td.addEventListener('keydown', (e)=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); td.click(); }});
      }
      tr.appendChild(td);
    }
    t.appendChild(tr);
  }
}
function aplicarGuiaBordes(){
  document.querySelectorAll('#cartonesContainer td').forEach(td => td.classList.remove('invisibleNumero'));
  const posiciones = Array.from(document.querySelectorAll('#tablaGuia td.relleno')).map(x=>x.dataset.pos);
  if (posiciones.length===0) return;
  document.querySelectorAll('#cartonesContainer td').forEach(td=>{
    const pos = td.dataset.pos;
    if (!posiciones.includes(pos)) td.classList.add('invisibleNumero');
    else td.classList.remove('invisibleNumero');
  });
}
function guardarGuia(){ const rell=[]; document.querySelectorAll('#tablaGuia td.relleno').forEach(c=> rell.push(c.dataset.pos)); localStorage.setItem('guiaFigura', JSON.stringify(rell)); }
function restaurarGuia(){ const d = localStorage.getItem('guiaFigura'); if (!d) return; try{ const r = JSON.parse(d); r.forEach(pos=>{ const td = document.querySelector(`#tablaGuia td[data-pos="${pos}"]`); if(td) td.classList.add('relleno'); }); }catch{} }

/* accesibility reapply */
function attachAllCellListeners(){ document.querySelectorAll('#cartonesContainer .carton').forEach(div => attachCellListeners(div)); }
const observer = new MutationObserver(()=>{ attachAllCellListeners(); aplicarGuiaBordes(); });
observer.observe(cartonesContainer, { childList:true, subtree:true });

</script>
</body>
</html>
