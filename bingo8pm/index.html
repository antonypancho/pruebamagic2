</style>
</head>
<body>

<header role="banner">
  <img src="logo.png" alt="Logo Bingo 8pm">
  <h1>🎉 Bingo Magic 8:00pm</h1>
</header>

<div class="toolbar" role="region" aria-label="Barra de herramientas">
  <input type="number" id="cartonInput" placeholder="Número de cartón" aria-label="Número de cartón">
  <button id="agregarBtn" disabled aria-label="Agregar cartón">Agregar</button>
  <button id="limpiarBtn" aria-label="Limpiar marcas">Limpiar</button>
  <button id="quitarBtn" aria-label="Quitar cartones">Quitar</button>
  <button id="zoomIn" aria-label="Aumentar zoom">+</button>
  <button id="zoomOut" aria-label="Disminuir zoom">-</button>

  <div class="temas" role="toolbar" aria-label="Temas">
    <div class="tema" style="background:#000000;" onclick="cambiarTema('azul')" title="Azul (oscuro)" role="button" tabindex="0"></div>
    <div class="tema" style="background:#ffffff;" onclick="cambiarTema('verde')" title="Verde (claro)" role="button" tabindex="0"></div>
    <div class="tema" style="background:#9c27b0;" onclick="cambiarTema('morado')" title="Morado (oscuro)" role="button" tabindex="0"></div>
  </div>

  <div id="status" aria-live="polite"></div>
</div>

<main>
  <h1>🎟️ Juega tu Cartón</h1>
  <h2>👇Dibuja La Figura que estamos jugando👇</h2>

  <div id="guiaFigura" aria-label="Guía de figura">
    <table id="tablaGuia" role="grid" aria-label="Tabla guía 5 por 5"></table>
  </div>

  <div id="cartonesContainer" aria-live="polite" role="region" aria-label="Contenedor de cartones"></div>
</main>

<footer role="contentinfo">
  &copy; 2025 BingoMagic.online — ¡Diversión mágica en cada partida!
</footer>

<script>
let cartonesData = [];
let cartonesMostrados = [];

const agregarBtn = document.getElementById('agregarBtn');
const limpiarBtn = document.getElementById('limpiarBtn');
const quitarBtn = document.getElementById('quitarBtn');
const statusEl = document.getElementById('status');
const zoomInBtn = document.getElementById('zoomIn');
const zoomOutBtn = document.getElementById('zoomOut');

document.addEventListener('DOMContentLoaded', () => {
  const temaGuardado = localStorage.getItem("temaBingo");
  if (temaGuardado) cambiarTema(temaGuardado);
  else {
    // asegurar que la variable CSS del título se inicialice incluso si no hay tema guardado
    document.documentElement.style.setProperty('--titulo-carton', '#00d4ff');
  }

  const zoomGuardado = localStorage.getItem("zoomCarton");
  if (zoomGuardado) {
    document.documentElement.style.setProperty('--escalaCarton', zoomGuardado);
  }

  crearGuia();
  restaurarGuia();

  cargarCSV().then(() => {
    agregarBtn.disabled = false;
    restaurarEstado();
    aplicarGuiaBordes();
  });

  agregarBtn.addEventListener('click', agregarCarton);
  limpiarBtn.addEventListener('click', limpiarMarcas);
  quitarBtn.addEventListener('click', quitarCartones);
  zoomInBtn.addEventListener('click', () => ajustarZoom(0.1));
  zoomOutBtn.addEventListener('click', () => ajustarZoom(-0.1));
});

/* CSV */
async function cargarCSV(){
  statusEl.textContent = 'Cargando cartones...';
  try {
    const res = await fetch('./csv/cartones.csv', { cache: "no-store" });
    if (!res.ok) throw new Error('CSV no encontrado');
    const text = await res.text();
    cartonesData = parseCSV(text);
    statusEl.textContent = `✅ ${cartonesData.length} cartones cargados.`;
  } catch (e) {
    console.error(e);
    statusEl.textContent = 'Error cargando CSV. Verifica la ruta /csv/cartones.csv y que el archivo esté publicado.';
    agregarBtn.disabled = true;
  }
}

function parseCSV(text){
  const lines = text.split(/\r?\n/).map(l => l.trim()).filter(l => l !== '');
  const cartones = [];
  let i = 0;
  while (i < lines.length) {
    if (lines[i].toUpperCase().startsWith("CARTÓN")) { i++; continue; }
    if (lines[i].toUpperCase() === "B,I,N,G,O") { i++; }
    const carton = [];
    for (let r = 0; r < 5 && i < lines.length; r++, i++) {
      const fila = lines[i].split(',').map(n => n.trim());
      carton.push(fila);
    }
    if (carton.length === 5) cartones.push(carton);
  }
  return cartones;
}

/* Render y UI */
function agregarCarton(){
  const numero = parseInt(document.getElementById("cartonInput").value, 10);
  if (isNaN(numero)) { alert("Ingresa un número."); return; }
  if (numero < 1 || numero > cartonesData.length) { alert("Número inválido."); return; }
  if (cartonesMostrados.includes(numero)) { alert("Ese cartón ya está en pantalla."); return; }

  renderCarton(numero);
  guardarEstado();
  document.getElementById("cartonInput").value = '';
}

function renderCarton(numero){
  const carton = cartonesData[numero - 1];
  if (!carton) return;
  const div = document.createElement("div");
  div.className = "carton";
  div.dataset.numero = numero;
  div.innerHTML = `<h3>Cartón ${numero}</h3><table>${crearTabla(carton, numero)}</table>`;

  // Botón X en esquina superior derecha
  const closeBtn = document.createElement('button');
  closeBtn.className = 'close-btn';
  closeBtn.type = 'button';
  closeBtn.setAttribute('aria-label', `Cerrar cartón ${numero}`);
  closeBtn.innerHTML = '✕';
  closeBtn.addEventListener('click', () => {
    const ok = confirm(`¿Quitar el cartón ${numero}?`);
    if (!ok) return;

    div.remove();

    const idx = cartonesMostrados.indexOf(numero);
    if (idx > -1) cartonesMostrados.splice(idx, 1);

    const estadoStr = localStorage.getItem('estadoCartones');
    if (estadoStr) {
      try {
        const estado = JSON.parse(estadoStr);
        if (Array.isArray(estado.marcados)) {
          estado.marcados = estado.marcados.filter(m => {
            return cartonesMostrados.includes(parseInt(m.carton, 10));
          });
        }
        estado.cartones = cartonesMostrados.slice();
        localStorage.setItem('estadoCartones', JSON.stringify(estado));
      } catch (e) {
        guardarEstado();
      }
    } else {
      guardarEstado();
    }

    aplicarGuiaBordes();
    statusEl.textContent = `Cartón ${numero} eliminado.`;
  });

  div.appendChild(closeBtn);

  document.getElementById("cartonesContainer").appendChild(div);
  cartonesMostrados.push(numero);
  aplicarGuiaBordes();
  attachCellListeners(div);
}

function crearTabla(carton, numero){
  let html = '';
  const letras = ['B','I','N','G','O'];
  html += '<tr>';
  for (let c = 0; c < 5; c++) html += `<th scope="col">${letras[c]}</th>`;
  html += '</tr>';
  for (let r = 0; r < 5; r++) {
    html += '<tr>';
    for (let c = 0; c < 5; c++) {
      const val = carton[r][c] ?? '';
      const isFree = (typeof val === 'string' && val.toUpperCase() === 'X');
      const classes = isFree ? 'free' : '';
      html += `<td class="${classes}" data-carton="${numero}" data-pos="${r},${c}" tabindex="${isFree ? -1 : 0}" role="gridcell" aria-label="Cartón ${numero} fila ${r+1} columna ${c+1}">${val}</td>`;
    }
    html += '</tr>';
  }
  return html;
}

/* Delegación de eventos para celdas (mejor que inline onclick) */
function attachCellListeners(root){
  root.querySelectorAll('td').forEach(td => {
    if (!td.classList.contains('free')) {
      td.addEventListener('click', () => cambiarColor(td));
      td.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); cambiarColor(td); } });
    }
  });
}

function cambiarColor(td){
  if (td.classList.contains('free')) return;
  td.classList.toggle("marcado1");
  guardarEstado();
}

function limpiarMarcas(){
  document.querySelectorAll('#cartonesContainer td.marcado1').forEach(td => td.classList.remove('marcado1'));
  guardarEstado();
  document.querySelectorAll('#cartonesContainer td.bordeGuia').forEach(td => td.classList.remove('bordeGuia'));
  localStorage.removeItem("guiaFigura");
  crearGuia();
}

function quitarCartones(){
  document.getElementById("cartonesContainer").innerHTML = '';
  cartonesMostrados = [];
  localStorage.removeItem("estadoCartones");
  statusEl.textContent = 'Se quitaron los cartones y se limpió tu almacenamiento.';
  localStorage.removeItem("guiaFigura");
  crearGuia();
}

/* Persistencia de cartones y marcas */
function guardarEstado(){
  const estado = { cartones: cartonesMostrados.slice(), marcados: [] };
  document.querySelectorAll('#cartonesContainer td.marcado1').forEach(td => {
    const carton = td.dataset.carton;
    const pos = td.dataset.pos;
    estado.marcados.push({carton, pos});
  });
  localStorage.setItem("estadoCartones", JSON.stringify(estado));
}

function restaurarEstado(){
  const estadoStr = localStorage.getItem("estadoCartones");
  if (!estadoStr) return;
  let estado;
  try { estado = JSON.parse(estadoStr); } catch { return; }

  if (Array.isArray(estado.cartones)) {
    estado.cartones.forEach(num => renderCarton(num));
  }
  if (Array.isArray(estado.marcados)) {
    setTimeout(() => {
      estado.marcados.forEach(m => {
        const td = document.querySelector(`#cartonesContainer td[data-carton="${m.carton}"][data-pos="${m.pos}"]`);
        if (td) td.classList.add('marcado1');
      });
    }, 120);
  }
}

/* Zoom */
function ajustarZoom(delta){
  let escala = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--escalaCarton')) || 1;
  escala = Math.round((escala + delta) * 100) / 100;
  if (escala < 0.5) escala = 0.5;
  if (escala > 2) escala = 2;
  document.documentElement.style.setProperty('--escalaCarton', escala);
  localStorage.setItem("zoomCarton", escala);
}

/* Temas */
function cambiarTema(color){
  if (color === 'azul'){
    document.documentElement.style.setProperty('--carton', '#1b1b1b');
    document.documentElement.style.setProperty('--texto', '#ffffff');
    document.documentElement.style.setProperty('--marcado', '#2196f3');
    document.documentElement.style.setProperty('--borde', '#ada8a8');
    document.documentElement.style.setProperty('--free-bg', '#444444');
    document.documentElement.style.setProperty('--titulo-carton', '#00d4ff');
  } else if (color === 'verde'){
    document.documentElement.style.setProperty('--carton', '#f5f5f5');
    document.documentElement.style.setProperty('--texto', '#000000');
    document.documentElement.style.setProperty('--marcado', '#4caf50');
    document.documentElement.style.setProperty('--borde', '#333333');
    document.documentElement.style.setProperty('--free-bg', '#e0e0e0');
    document.documentElement.style.setProperty('--titulo-carton', '#000000');
  } else if (color === 'morado'){
    document.documentElement.style.setProperty('--carton', '#f8bbd0');
    document.documentElement.style.setProperty('--texto', '#000000');
    document.documentElement.style.setProperty('--marcado', '#e91e63');
    document.documentElement.style.setProperty('--borde', '#ffffff');
    document.documentElement.style.setProperty('--titulo-carton', '#0040BD');
  }
  localStorage.setItem("temaBingo", color);
}

/* Guía 5x5 */
function crearGuia(){
  const tabla = document.getElementById("tablaGuia");
  tabla.innerHTML = '';
  for(let r=0; r<5; r++){
    const fila = document.createElement("tr");
    for(let c=0; c<5; c++){
      const celda = document.createElement("td");
      celda.dataset.pos = `${r},${c}`;
      if(r === 2 && c === 2){
        celda.textContent = 'X';
        celda.classList.add('centro');
        celda.setAttribute('aria-hidden','true');
      } else {
        celda.tabIndex = 0;
        celda.addEventListener('click', () => {
          celda.classList.toggle('relleno');
          guardarGuia();
          aplicarGuiaBordes();
        });
        celda.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); celda.click(); }});
      }
      fila.appendChild(celda);
    }
    tabla.appendChild(fila);
  }
}

function aplicarGuiaBordes() {
  // limpiar visual previo (solo elimina la clase que oculta números)
  document.querySelectorAll('#cartonesContainer td').forEach(td => {
    td.classList.remove('invisibleNumero');
  });

  // posiciones activas en la guía
  const posicionesGuia = Array.from(document.querySelectorAll('#tablaGuia td.relleno'))
    .map(celda => celda.dataset.pos);

  if (posicionesGuia.length === 0) return;

  // aplicar solo la visibilidad (sin añadir bordes)
  document.querySelectorAll('#cartonesContainer td').forEach(td => {
    const pos = td.dataset.pos;
    if (!posicionesGuia.includes(pos)) {
      td.classList.add('invisibleNumero');
    } else {
      td.classList.remove('invisibleNumero');
    }
  });
}

/* Persistencia guia */
function guardarGuia(){
  const rellenos = [];
  document.querySelectorAll('#tablaGuia td.relleno').forEach(celda => rellenos.push(celda.dataset.pos));
  localStorage.setItem('guiaFigura', JSON.stringify(rellenos));
}

function restaurarGuia(){
  const data = localStorage.getItem('guiaFigura');
  if (!data) return;
  let rellenos;
  try { rellenos = JSON.parse(data); } catch { return; }
  rellenos.forEach(pos => {
    const celda = document.querySelector(`#tablaGuia td[data-pos="${pos}"]`);
    if (celda) celda.classList.add('relleno');
  });
}

/* Al agregar nuevos cartones desde estado restaurado, reaplicar listeners y guía */
function attachAllCellListeners(){
  document.querySelectorAll('#cartonesContainer .carton').forEach(div => attachCellListeners(div));
}

const observer = new MutationObserver(() => {
  attachAllCellListeners();
  aplicarGuiaBordes();
});
observer.observe(document.getElementById('cartonesContainer'), { childList: true, subtree: true });

</script>
</body>
</html>
